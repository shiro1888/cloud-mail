name: Manual deploy prod-mail-core (fallback)

# push 自动部署已由 Cloudflare Workers Builds 接管(见 README/映射文档)。
# 本 workflow 仅作为手动补部署通道:构建 mail-vue 前端后用静态生产配置部署。

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 11
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install worker dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker
      - name: Build frontend
        run: pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build
        working-directory: ./mail-worker
      - name: Deploy Worker
        run: pnpm wrangler deploy -c wrangler-build.toml
        working-directory: ./mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
