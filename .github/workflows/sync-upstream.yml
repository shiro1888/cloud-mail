name: Sync upstream cloud-mail

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC - follow upstream maillab/cloud-mail
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Take upstream tree, push, and trigger deploy when worker/vue changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(git rev-parse HEAD)
          git config user.name "cloud-mail-sync-bot"
          git config user.email "4444023+cloud-mail-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/maillab/cloud-mail.git
          git fetch upstream main
          git checkout upstream/main -- .
          git checkout HEAD -- mail-worker/wrangler.toml .github/workflows/deploy-cloudflare.yml .github/workflows/sync-upstream.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes to sync"
          else
            git commit -m "sync: upstream maillab/cloud-mail $(date -u +%Y-%m-%d)"
            git push origin main
            if ! git diff --quiet "$BEFORE" HEAD -- mail-worker/ mail-vue/; then
              gh workflow run deploy-cloudflare.yml --repo "${{ github.repository }}" --ref main
            fi
          fi
